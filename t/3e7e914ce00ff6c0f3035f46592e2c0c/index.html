const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(IV)},key,u(CT));
  // the page needs the key to open the documents; document.open() can drop window properties, so the raw key rides
  // inside the decrypted page's first script, in memory only
  const raw=btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey("raw",key))));
  const page=new TextDecoder().decode(pt).replace("<script>",'<script>window.HKEYRAW="'+raw+'";');
  document.open();document.write(page);document.close();
}
async function derive(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:u(S),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
// "Keep me signed in" stores the derived key (never the password) in this browser until Sign out; the page's Sign out clears it
const saved=localStorage.getItem("k")||sessionStorage.getItem("k");
if(saved)crypto.subtle.importKey("raw",u(saved),"AES-GCM",true,["decrypt"]).then(open_).catch(()=>{localStorage.removeItem("k");sessionStorage.removeItem("k")});
document.getElementById("f").onsubmit=async ev=>{
  ev.preventDefault();const err=document.getElementById("err");err.textContent="Opening...";
  try{const key=await derive(document.getElementById("pw").value);
    const raw=new Uint8Array(await crypto.subtle.exportKey("raw",key));
    await crypto.subtle.decrypt({name:"AES-GCM",iv:u(IV)},key,u(CT));
    if(document.getElementById("rem").checked)localStorage.setItem("k",btoa(String.fromCharCode(...raw)));
    await open_(key);
  }catch(e){err.textContent="That password did not work. Try again.";}
};
